name: run-experiment
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Path of the script to run (under experiments/ or scripts/)'
        required: true
      args:
        description: 'Extra arguments'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          case "${{ inputs.script }}" in experiments/*|scripts/*) ;; *) echo "script must be under experiments/ or scripts/"; exit 1;; esac
          python "${{ inputs.script }}" ${{ inputs.args }} | tee run_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: |
            run_output.txt
            result.json
          if-no-files-found: ignore
      - name: Append result.json to results.jsonl
        run: |
          if [ -f result.json ]; then
            python -c "import json; r=json.load(open('result.json')); r['_script']='${{ inputs.script }}'; open('results.jsonl','a').write(json.dumps(r)+'\n')"
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add results.jsonl
            git commit -m "results: ${{ inputs.script }}" && git push || true
          fi
